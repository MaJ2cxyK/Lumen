[package]
name = "lumen-app"
version = "0.1.3"
description = "Lumen - local multi-agent collaboration workbench"
authors = ["MaJ2cxyK"]
license = "MIT"
repository = "https://github.com/MaJ2cxyK/Lumen"
edition = "2021"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = "0.4"
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
axum = "0.8"
regex = "1"
sha2 = "0.10"
rand = "0.8"
dirs = "6"
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-stream = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
